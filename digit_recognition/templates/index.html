<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Digit Recognition</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
        }

        #camera-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            margin: auto;
        }

        video {
            width: 100%;
            display: block;
            background-color: black;
        }

        #guide {
            position: absolute;
            border: 3px solid red;
            box-sizing: border-box;
            pointer-events: none;
        }

        button {
            margin: 10px;
            padding: 12px 20px;
            font-size: 16px;
        }

        #capture {
            display: none;
        }

        #status {
            margin-top: 15px;
        }

        #prediction {
            font-size: 50px;
            font-weight: bold;
            margin-top: 20px;
        }

        canvas {
            display: none;
        }
    </style>
</head>

<body>

    <h1>MNIST Digit Recognition</h1>

    <div id="camera-container">
        <video
            id="video"
            autoplay
            playsinline
            muted
        ></video>

        <div id="guide"></div>
    </div>

    <button id="capture" type="button">
        Capture & Predict
    </button>

    <button id="clear" type="button">
        Clear
    </button>

    <div id="status">Starting camera...</div>

    <div id="prediction"></div>

    <canvas id="canvas"></canvas>

    <script>
        const video = document.getElementById("video");
        const canvas = document.getElementById("canvas");
        const guide = document.getElementById("guide");

        const captureButton =
            document.getElementById("capture");

        const clearButton =
            document.getElementById("clear");

        const statusElement =
            document.getElementById("status");

        const predictionElement =
            document.getElementById("prediction");

        let stream = null;


        function positionGuide() {
            if (
                video.clientWidth === 0 ||
                video.clientHeight === 0
            ) {
                return;
            }

            const size = Math.min(
                video.clientWidth,
                video.clientHeight
            ) * 0.70;

            guide.style.width = size + "px";
            guide.style.height = size + "px";

            guide.style.left =
                (video.clientWidth - size) / 2 + "px";

            guide.style.top =
                (video.clientHeight - size) / 2 + "px";
        }


        async function startCamera() {
            try {
                statusElement.textContent =
                    "Requesting camera permission...";

                if (
                    !navigator.mediaDevices ||
                    !navigator.mediaDevices.getUserMedia
                ) {
                    throw new Error(
                        "Camera API is not available. " +
                        "Open the app using http://127.0.0.1:5000"
                    );
                }

                stream =
                    await navigator.mediaDevices.getUserMedia({
                        video: {
                            facingMode: {
                                ideal: "environment"
                            }
                        },
                        audio: false
                    });

                console.log(
                    "Camera permission granted:",
                    stream
                );

                video.srcObject = stream;

                statusElement.textContent =
                    "Camera permission granted. Starting camera...";

                // Wait until the camera video has metadata.
                await new Promise((resolve) => {
                    if (video.readyState >= 1) {
                        resolve();
                    } else {
                        video.addEventListener(
                            "loadedmetadata",
                            resolve,
                            { once: true }
                        );
                    }
                });

                // The previous code had: await ();
                // This is the correct statement.
                await video.play();

                console.log("Video playing");
                console.log(
                    "Video dimensions:",
                    video.videoWidth,
                    video.videoHeight
                );

                positionGuide();

                statusElement.textContent = "Camera ready";

                captureButton.style.display =
                    "inline-block";

            } catch (error) {
                console.error("Camera error:", error);

                statusElement.textContent =
                    "Camera error: " +
                    error.name +
                    " - " +
                    error.message;
            }
        }


        captureButton.addEventListener(
            "click",
            async function () {
                console.log("Capture clicked");

                if (
                    !stream ||
                    video.videoWidth === 0 ||
                    video.videoHeight === 0
                ) {
                    statusElement.textContent =
                        "Camera is not ready.";
                    return;
                }

                const videoRect =
                    video.getBoundingClientRect();

                const guideRect =
                    guide.getBoundingClientRect();

                const scaleX =
                    video.videoWidth / videoRect.width;

                const scaleY =
                    video.videoHeight / videoRect.height;

                let sourceX =
                    (guideRect.left - videoRect.left) *
                    scaleX;

                let sourceY =
                    (guideRect.top - videoRect.top) *
                    scaleY;

                let sourceWidth =
                    guideRect.width * scaleX;

                let sourceHeight =
                    guideRect.height * scaleY;

                sourceX = Math.max(0, sourceX);
                sourceY = Math.max(0, sourceY);

                sourceWidth = Math.min(
                    sourceWidth,
                    video.videoWidth - sourceX
                );

                sourceHeight = Math.min(
                    sourceHeight,
                    video.videoHeight - sourceY
                );

                canvas.width = Math.max(
                    1,
                    Math.round(sourceWidth)
                );

                canvas.height = Math.max(
                    1,
                    Math.round(sourceHeight)
                );

                const context =
                    canvas.getContext("2d");

                context.drawImage(
                    video,
                    sourceX,
                    sourceY,
                    sourceWidth,
                    sourceHeight,
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );

                const imageData =
                    canvas.toDataURL("image/png");

                statusElement.textContent =
                    "Sending image to server...";

                try {
                    const response = await fetch(
                        "/predict",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                image: imageData
                            })
                        }
                    );

                    const result =
                        await response.json();

                    console.log(
                        "Server response:",
                        result
                    );

                    if (!response.ok || result.error) {
                        statusElement.textContent =
                            "Error: " +
                            (
                                result.error ||
                                "Prediction failed"
                            );

                        return;
                    }

                    predictionElement.textContent =
                        result.prediction;

                    statusElement.textContent =
                        "Prediction complete.";

                } catch (error) {
                    console.error(
                        "Prediction error:",
                        error
                    );

                    statusElement.textContent =
                        "Prediction error: " +
                        error.message;
                }
            }
        );


        clearButton.addEventListener(
            "click",
            function () {
                predictionElement.textContent = "";

                statusElement.textContent = stream
                    ? "Camera ready"
                    : "Camera is not ready";
            }
        );


        window.addEventListener(
            "resize",
            positionGuide
        );

        startCamera();
    </script>

</body>
</html>
